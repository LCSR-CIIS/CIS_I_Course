# Config-file equivalent of the end-to-end example in api_calls/README.md.
# Load it with:
#
#   from tracker_client import TrackerClient
#   from scenario import load_scenario
#
#   client = TrackerClient()
#   load_scenario(client, "scenario_example.yaml")
#
# This only covers the one-time setup (marker bodies, tracker, pointer) --
# the per-observation hand-guide/sample/sense-tip loop still runs as plain
# Python, since it isn't static config.

marker_bodies:
  - name: ptr_mb
    positions:
      - [0, 0, 0]
      - [50, 0, 0]
      - [0, 50, 0]
      - [0, 0, 50]
      - [30, 20, 10]

  - name: cal_mb
    is_calibration: true
    positions:
      - [0, 0, 0]
      - [60, 0, 0]
      - [0, 60, 0]
      - [0, 0, 60]
    place:
      R: [[1, 0, 0], [0, 1, 0], [0, 0, 1]]
      p: [500, 0, 0]

trackers:
  - name: trk1
    marker_body_names: [ptr_mb, cal_mb]
    pose:
      R: [[1, 0, 0], [0, 1, 0], [0, 0, 1]]
      p: [0, 0, 0]

pointers:
  - name: ptr1
    marker_body_name: ptr_mb
    nominal_tip_position: [0, 0, -150]
